version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    ignore:
      # mcp 2.0 removed mcp.server.fastmcp (breaking); hold at <2.0 until server API migration
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
